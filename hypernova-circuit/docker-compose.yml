services:
  hypernova-racer:
    build: .
    image: hypernova-racer:3.0.0
    container_name: hypernova-racer
    restart: unless-stopped
    init: true
    ports:
      - "${GAME_PORT:-8091}:3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 4
