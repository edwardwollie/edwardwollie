server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;


    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "neon-dominion-ok\n";
    }

    location = /.well-known/flexzonic-game.json {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml model/gltf-binary;

    # Code revalidates on every load (cheap 304s) so a new release is never mixed with cached modules.
    location ~* \.(?:css|js|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.glb$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|pdf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Blueprint files are private design material and are not shipped; never serve them.
    location ^~ /assets/blueprints/ {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
