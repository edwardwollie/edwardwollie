services:
  spaceflight-academy:
    build:
      context: .
      dockerfile: Dockerfile
    image: spaceflight-academy:3.0.2
    container_name: spaceflight-academy
    restart: unless-stopped
    # Reuse Docker's built-in bridge so a large game library does not exhaust
    # Compose's automatic subnet pools. The published host port is unchanged.
    network_mode: bridge
    ports:
      - "${SPACEFLIGHT_PORT:-8119}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz | grep -q spaceflight-academy-ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
