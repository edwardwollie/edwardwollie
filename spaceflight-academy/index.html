<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#62e8ff"/>
<meta name="description" content="Explore a 3D spaceport, fly through read-aloud space-science answer gates, engineer real rockets, and land on new worlds across ninety age-adaptive missions for ages 5–12."/>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" href="/icon.svg"/>
<meta property="og:title" content="Spaceflight Academy"/>
<meta property="og:description" content="Listen. Think. Fly the gates. Build for orbit."/>
<meta property="og:image" content="https://spaceflight.flexzonicgames.com/og.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://spaceflight.flexzonicgames.com/og.png"/>
<title>Spaceflight Academy</title>
<style>
html,body{margin:0;height:100%;background:#070b25;color:#f4f8ff;overflow:hidden}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1d2a72 0,#0a0f33 45%,#050818 100%);font-family:system-ui,sans-serif;z-index:50;transition:opacity .5s}
#boot.gone{opacity:0;pointer-events:none}
#boot .b{text-align:center}
#boot .r{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;border:5px solid #62e8ff33;border-top-color:#62e8ff;animation:s 1s linear infinite}
#boot b{display:block;font-size:26px;letter-spacing:.12em}
#boot small{display:block;margin-top:8px;color:#9fb3e8;letter-spacing:.2em;font-size:12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="b"><div class="r"></div><b>SPACEFLIGHT ACADEMY</b><small>PREPARING THE SPACEPORT…</small></div></div>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Spaceflight Academy needs JavaScript. Ask a grown-up to turn it on.</p></noscript>
<script type="module" src="/src/v3/main.tsx"></script>
</body>
</html>
